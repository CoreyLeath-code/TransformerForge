name: TransformerForge Container Image Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-scan:
    name: Build and scan container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: docker build --pull -t transformerforge:${{ github.sha }} .
      - name: Locate residual Python package artifacts
        run: |
          docker run --rm --user 0 --entrypoint /bin/sh transformerforge:${{ github.sha }} -ec '
            find / \( -iname "*msgpack*" -o -iname "*setuptools*" \) -print || true
          '
      - name: Scan high and critical image findings
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: transformerforge:${{ github.sha }}
          format: table
          output: trivy-image-results.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Show Trivy findings when the gate fails
        if: failure()
        run: cat trivy-image-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image-results.txt
          if-no-files-found: warn
